name: CI

# Roda a cada push e pull request: tipos, testes de regra de negócio, build e testes ponta a ponta.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Instalar dependências (versões travadas no bun.lock)
        run: bun install --frozen-lockfile

      - name: Tipos (tsc)
        run: npm run lint

      - name: Testes de regra de negócio (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Navegador para os testes ponta a ponta
        run: npx playwright install --with-deps chromium

      - name: Testes ponta a ponta (Playwright)
        run: npm run test:e2e

      - name: Relatório dos testes ponta a ponta (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
