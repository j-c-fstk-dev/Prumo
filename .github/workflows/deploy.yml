name: Deploy (Cloudflare)

# Publica o app no Cloudflare Worker "prumo".
# Automático a cada push na main; também pode ser disparado à mão (aba Actions → Deploy → Run workflow).
# Precisa dos secrets do repositório CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID (docs/etapas/18-cloudflare.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - name: Conferir se a Cloudflare está configurada
        if: env.HAS_TOKEN != 'true'
        run: |
          echo "::notice::Deploy pulado: configure CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID nos secrets do repositório."

      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_TOKEN == 'true'
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        if: env.HAS_TOKEN == 'true'

      - name: Instalar, testar e gerar o build
        if: env.HAS_TOKEN == 'true'
        run: |
          bun install --frozen-lockfile
          npm run lint
          npm test
          npm run build

      - name: Publicar na Cloudflare
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy
